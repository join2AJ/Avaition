name: Deploy AEP Portal to GitHub Pages

# Builds the Vite frontend and publishes it to GitHub Pages on every push to the
# working branch. The app already ships a role-picker login page, so the Pages
# URL lands straight on it.
on:
  push:
    branches: [claude/aep-portal-aviation-z1e2pe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install & build (base = /Avaition/)
        working-directory: frontend
        env:
          VITE_BASE: /Avaition/
        run: |
          npm ci || npm install
          npm run build
          # SPA fallback so deep links (/Avaition/app/...) resolve to the app.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
