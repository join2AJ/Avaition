# AEP Portal — full stack for on-prem, cloud, or hybrid deployment.
#
#   web (Nginx+SPA :8080) ──/api──► backend (FastAPI :8000) ──► db (Postgres)
#                                              │
#                                              ├─► redis  (sessions, throttle, notification fan-out)
#                                              └─► minio  (S3-compatible object store for attachments)
#
# Quick start:
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#   open http://localhost:8080        (API docs: http://localhost:8080/api/docs)
#
# See docs/DEPLOYMENT.md for production hardening and the on-prem/cloud/hybrid guides.
name: aep-portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aep_password}
      POSTGRES_DB: ${POSTGRES_DB:-aep_portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aep} -d ${POSTGRES_DB:-aep_portal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aep}:${POSTGRES_PASSWORD:-aep_password}@db:5432/${POSTGRES_DB:-aep_portal}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aepportal.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aep-attachments}
      SEED_ON_START: ${SEED_ON_START:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_BASE: /
        VITE_API_BASE: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
