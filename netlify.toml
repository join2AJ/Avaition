# Netlify config for the AEP Portal frontend (Vite + React + TS).
# The app lives in frontend/; Netlify builds it and serves the static output.
[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every route resolves to index.html so client-side routing
# (react-router) doesn't 404 on refresh or deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
